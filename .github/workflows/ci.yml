name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs >= 22.5; the engines field enforces the same floor.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `pretest` builds into .next-test, then the suite boots a real server and
      # drives it over HTTP and Socket.IO. No extra services are needed: it uses
      # a throwaway SQLite database and reads login codes from the server's own
      # console output.
      - name: Test
        run: npm test
