name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs >= 22.5; the engines field enforces the same floor.
          node-version: 22
          cache: npm

      - run: npm ci

      # Must come before the typecheck. Next generates types a fresh checkout
      # does not have — `LayoutProps` among them — so `tsc` fails without a
      # build first. Building into .next-test also means the test step does not
      # have to repeat it.
      - name: Build
        run: npm run build:test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `node --test` directly rather than `npm test`, because that would run
      # the pretest build again for nothing.
      #
      # The suite boots a real server and drives it over HTTP and Socket
      # connections. No services are needed: it uses a throwaway PGlite
      # database and reads login codes from the server's own console output.
      - name: Test
        run: node --test
